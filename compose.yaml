name: journeycab

# Local persistent service. For public hosting use HTTPS and the production
# settings in DEPLOYMENT.md; do not expose this HTTP development configuration.
services:
  app:
    build: .
    image: journeycab:local
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${JOURNEYCAB_PORT:-5173}:3001"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      APP_ORIGIN: "http://127.0.0.1:${JOURNEYCAB_PORT:-5173}"
      DATABASE_PATH: /app/data/journeycab.sqlite
      TRUST_PROXY: "0"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
